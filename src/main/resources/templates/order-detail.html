<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Order #' + ${order.id}">Order Detail</title>
    <link rel="icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/legacy-mvc.css}">
    <script th:src="@{/js/simpleFunction.js}" defer></script>
</head>
<body class="legacy-page">
<header th:replace="fragments :: header"></header>

<section class="order-history">
    <article class="order-card">
        <p><a th:href="@{/orders}">&larr; Back to orders</a></p>
        <h1 th:text="'Order #' + ${order.id}">Order #1</h1>
        <p th:text="${order.createdAt}">Created</p>
        <p th:text="${order.status} + ' / ' + ${order.paymentStatus}">Status</p>
        <p th:text="${order.customerName}">Customer name</p>
        <p th:text="${order.email}">customer@example.com</p>
        <p th:text="${order.address}">Shipping address</p>
        <strong th:text="'RM ' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}">RM 0.00</strong>
        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${order.lines}">
                <td th:text="${line.productName}">Product</td>
                <td th:text="${line.quantity}">1</td>
                <td th:text="'RM ' + ${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 2, 'POINT')}">RM 0.00</td>
            </tr>
            </tbody>
        </table>
    </article>
</section>

<footer th:replace="fragments :: footer"></footer>
</body>
</html>
