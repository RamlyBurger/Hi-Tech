<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Products</title>
    <link rel="icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="fragments :: header"></header>
<main>
    <section class="page-heading">
        <h1 th:text="${pageTitle}">Products</h1>
        <p>Shop the Hi-Tech catalog by category or search for a specific device.</p>
    </section>

    <section class="category-grid">
        <a th:each="category : ${navCategories}" th:href="@{/products/{code}(code=${category.code})}" class="category-card">
            <img th:src="@{${category.imagePath}}" th:alt="${category.name}">
            <span th:text="${category.name}">Category</span>
        </a>
    </section>

    <section class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <a th:href="@{/products/item/{slug}(slug=${product.slug})}">
                <img th:src="@{${product.imagePath}}" th:alt="${product.name}">
            </a>
            <div>
                <p th:text="${product.category.name}">Category</p>
                <h3 th:text="${product.name}">Product</h3>
                <span th:if="${product.discountPercentage > 0}" class="discount" th:text="'-' + ${product.discountPercentage} + '%'">-10%</span>
                <strong th:text="'RM ' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">RM 0.00</strong>
                <a class="button small" th:href="@{/products/item/{slug}(slug=${product.slug})}">View details</a>
            </div>
        </article>
    </section>
</main>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
