<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/icon/logo.png}">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:href="@{/css/products.css}" rel="stylesheet">
    <link th:href="@{/css/productsOption.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/legacy-mvc.css}" rel="stylesheet">
    <script th:src="@{/js/simpleFunction.js}" defer></script>
    <title th:text="${pageTitle}">Products</title>
</head>
<body class="legacy-page legacy-products">
<header th:replace="fragments :: header"></header>

<div class="productsAll">
    <div th:each="category : ${navCategories}"
         class="product-category-tile"
         th:classappend="${category.code + 'col'}">
        <a th:href="@{/products/{code}(code=${category.code})}">
            <img th:src="@{${category.imagePath}}" th:alt="${category.name}">
        </a>
        <h1 class="producth1"><em th:text="${category.name}">Desktop</em></h1>
    </div>

    <div class="partner">
        <h1 class="partnerh1">** Preferred Partners **</h1>
    </div>

    <div class="partnerlogo">
        <img th:src="@{/icon/lenovo.png}" width="100" height="80" alt="Lenovo">
        <img th:src="@{/icon/hp.png}" width="100" height="80" alt="HP">
        <img th:src="@{/icon/dell.png}" width="100" height="80" alt="Dell">
        <img th:src="@{/icon/asus.png}" width="100" height="80" alt="Asus">
        <img th:src="@{/icon/acer.png}" width="100" height="80" alt="Acer">
        <img th:src="@{/icon/msi.png}" width="100" height="80" alt="MSI">
        <img th:src="@{/icon/fujitsu.png}" width="100" height="80" alt="Fujitsu">
    </div>

    <hr class="hr4">

    <h1 class="featured-products-title legacy-section-title">Featured products</h1>
    <div class="featured-products-grid">
        <div class="card" th:each="product : ${products}">
            <a th:href="@{/products/item/{slug}(slug=${product.slug})}">
                <img th:src="@{${product.imagePath}}" th:alt="${product.name}">
            </a>
            <span th:if="${product.discountPercentage > 0}" class="discount"
                  th:text="'-' + ${product.discountPercentage} + '%'">-25%</span>
            <div class="panel">
                <a th:href="@{/products/item/{slug}(slug=${product.slug})}" class="icon-text">&#9829;</a>
                <a th:href="@{/products/item/{slug}(slug=${product.slug})}" class="icon-text">&#8599;</a>
                <a th:href="@{/products/item/{slug}(slug=${product.slug})}" class="icon-text">&#8981;</a>
            </div>
            <form th:action="@{/cart/items}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="hidden" name="quantity" value="1">
                <button type="submit">add to cart</button>
            </form>
            <div class="info">
                <h3 th:text="${product.name}">Product</h3>
                <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
                <strong class="price"
                        th:text="'RM' + ${#numbers.formatDecimal(product.salePrice, 1, 'COMMA', 2, 'POINT')}">RM0</strong>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments :: footer"></footer>
</body>
</html>
