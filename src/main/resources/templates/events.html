<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/events.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/legacy-mvc.css}">
    <script th:src="@{/js/simpleFunction.js}" defer></script>
</head>
<body class="body1 legacy-page">
<header th:replace="fragments :: header"></header>

<section id="titleBox">
    <div class="titleBox2"><h1 class="title">Event</h1></div>
    <p class="promotitle">Schedule</p>
    <table class="schedule" id="schedule">
        <thead>
        <tr>
            <th>No.</th>
            <th>Name</th>
            <th>Venue</th>
            <th>Time</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event, stat : ${events}" th:class="${stat.even ? 'active-row' : ''}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${event.name}">Gaming Competition</td>
            <td th:text="${event.venue}">Segamat</td>
            <td th:text="${event.eventTime}">8.00am</td>
            <td th:text="${event.eventDate}">1st Oct</td>
        </tr>
        </tbody>
    </table>
    <p class="promotitle" id="promo">Promotion</p>
    <dl class="promo">
        <th:block th:each="promotion : ${promotions}">
            <dt th:text="${promotion.startsOn} + ' - ' + ${promotion.endsOn}">26th Sept - 31st Sept</dt>
            <dd>
                Promotion on
                <span th:style="'color:' + ${promotion.highlightColor}" th:text="${promotion.productName}">Iphone 14</span>
            </dd>
            <hr>
        </th:block>
    </dl>
</section>

<footer th:replace="fragments :: footer"></footer>
</body>
</html>
