<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="fragments :: header"></header>
<main>
    <section class="page-heading">
        <h1>Admin Dashboard</h1>
        <p>Manage catalog inventory, events, and promotions.</p>
    </section>
    <section class="admin-grid">
        <a class="admin-tile" th:href="@{/admin/products}">
            <span th:text="${productCount}">0</span>
            <strong>Products</strong>
        </a>
        <a class="admin-tile" th:href="@{/admin/events}">
            <span th:text="${eventCount}">0</span>
            <strong>Events</strong>
        </a>
        <a class="admin-tile" th:href="@{/admin/promotions}">
            <span th:text="${promotionCount}">0</span>
            <strong>Promotions</strong>
        </a>
    </section>
</main>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
