<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link rel="icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="fragments :: header"></header>
<main>
    <section class="page-heading">
        <h1>Account</h1>
        <p>Sign in to checkout, view orders, or manage admin inventory.</p>
    </section>

    <section class="auth-grid">
        <article class="auth-card">
            <h2>Sign in</h2>
            <p th:if="${param.error}" class="alert error">Invalid username or password.</p>
            <p th:if="${param.logout}" class="alert success">You have been signed out.</p>
            <p th:if="${registrationSuccess}" class="alert success">Account created. Sign in with your new username.</p>
            <form th:action="@{/login}" method="post" class="stacked-form">
                <label>
                    Username
                    <input type="text" name="username" autocomplete="username" required>
                </label>
                <label>
                    Password
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="primary">Login</button>
            </form>
            <p class="hint">Demo customer: <strong>customer</strong> / <strong>password</strong></p>
            <p class="hint">Demo admin: <strong>admin</strong> / <strong>password</strong></p>
        </article>

        <article class="auth-card">
            <h2>Sign up</h2>
            <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="stacked-form">
                <label>
                    Username
                    <input type="text" th:field="*{username}" autocomplete="username" required>
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</span>
                </label>
                <label>
                    Full name
                    <input type="text" th:field="*{fullName}" autocomplete="name" required>
                    <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Error</span>
                </label>
                <label>
                    Email
                    <input type="email" th:field="*{email}" autocomplete="email" required>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</span>
                </label>
                <label>
                    Password
                    <input type="password" th:field="*{password}" autocomplete="new-password" required>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</span>
                </label>
                <button type="submit">Create account</button>
            </form>
        </article>
    </section>
</main>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
