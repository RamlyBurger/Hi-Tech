<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="fragments :: header"></header>
<main>
    <section class="page-heading">
        <h1>Cart</h1>
        <p>Review quantities before simulated checkout.</p>
    </section>

    <p th:if="${cartMessage}" class="alert success" th:text="${cartMessage}">Product added</p>
    <p th:if="${cartError}" class="alert error" th:text="${cartError}">Error</p>

    <section th:if="${#lists.isEmpty(lines)}" class="section">
        <h2>Your cart is empty</h2>
        <p>Browse the product catalog to add desktops, laptops, smartphones, or accessories.</p>
        <a class="button primary" th:href="@{/products}">Shop products</a>
    </section>

    <section th:unless="${#lists.isEmpty(lines)}" class="section">
        <table class="data-table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Unit price</th>
                <th>Quantity</th>
                <th>Line total</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${lines}">
                <td>
                    <div class="cart-product">
                        <img th:src="@{${line.product.imagePath}}" th:alt="${line.product.name}">
                        <span th:text="${line.product.name}">Product</span>
                    </div>
                </td>
                <td th:text="'RM ' + ${#numbers.formatDecimal(line.product.salePrice, 1, 'COMMA', 2, 'POINT')}">RM 0.00</td>
                <td>
                    <form th:action="@{/cart/items/{id}/update(id=${line.product.id})}" method="post" class="quantity-form">
                        <input type="number" name="quantity" min="0" th:max="${line.product.stock}" th:value="${line.quantity}">
                        <button type="submit">Update</button>
                    </form>
                </td>
                <td th:text="'RM ' + ${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 2, 'POINT')}">RM 0.00</td>
                <td>
                    <form th:action="@{/cart/items/{id}/remove(id=${line.product.id})}" method="post">
                        <button type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="summary-row">
            <strong th:text="'Total: RM ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">Total</strong>
            <a class="button primary" th:href="@{/checkout}">Proceed to checkout</a>
        </div>
    </section>
</main>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
