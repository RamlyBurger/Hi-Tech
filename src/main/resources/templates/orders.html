<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
    <link rel="icon" th:href="@{/icon/logo.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="fragments :: header"></header>
<main>
    <section class="page-heading">
        <h1>Order History</h1>
        <p>Completed simulated purchases for your account.</p>
    </section>

    <p th:if="${orderMessage}" class="alert success" th:text="${orderMessage}">Order completed</p>

    <section th:if="${#lists.isEmpty(orders)}" class="section">
        <h2>No orders yet</h2>
        <p>Complete checkout to create an order.</p>
        <a class="button primary" th:href="@{/products}">Shop products</a>
    </section>

    <section th:unless="${#lists.isEmpty(orders)}" class="section order-list">
        <article th:each="order : ${orders}" class="order-card">
            <div class="section-heading">
                <h2 th:text="'Order #' + ${order.id}">Order #1</h2>
                <strong th:text="'RM ' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}">RM 0.00</strong>
            </div>
            <p th:text="${order.createdAt}">Created</p>
            <p th:text="${order.status} + ' / ' + ${order.paymentStatus}">Status</p>
            <table class="data-table">
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="line : ${order.lines}">
                    <td th:text="${line.productName}">Product</td>
                    <td th:text="${line.quantity}">1</td>
                    <td th:text="'RM ' + ${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 2, 'POINT')}">RM 0.00</td>
                </tr>
                </tbody>
            </table>
        </article>
    </section>
</main>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
